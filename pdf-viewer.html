<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Viewer is a tool page; the PDF files themselves carry the content for search. -->
  <title>Document Viewer | Mid-Florida Windows & Doors</title>
  <meta name="robots" content="noindex, follow" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- Fonts: Neuton (body) + Montserrat (headings/UI) -->
  <!-- Fonts are self-hosted; see the @font-face block at the top of css/styles.css.
       The variable Montserrat file covers every weight, so it is the only font
       worth preloading — it paints the h1 and all UI text. -->
  <link rel="preload" href="fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css?v=20261024d" />

  <!-- PDF.js (UMD build exposes window.pdfjsLib; worker URL set in js/pdf-viewer.js).
       If this fails to load, the page falls back to a direct PDF download link. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Google Tag Manager (loader + container ID live in js/gtm.js).
       Deferred on purpose: the third-party fetch must not compete with the
       banner image, which is this page's LCP element. -->
  <script src="js/gtm.js?v=20261108c" defer></script>
</head>
<body class="pdf-body">

  <!-- Google Tag Manager (noscript fallback). The ID is duplicated here
       because a <noscript> cannot read js/gtm.js — change BOTH this line and
       GTM_CONTAINER_ID in js/gtm.js when the container changes. -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MM3HDJWG" height="0" width="0" style="display:none;visibility:hidden" title="Google Tag Manager"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <!-- ===================== VIEWER TOP BAR ===================== -->
  <header class="pdf-topbar">
    <div class="container pdf-topbar__inner">
      <a class="pdf-topbar__home" href="index.html" aria-label="Mid-Florida Windows & Doors — Home">Mid-Florida Windows & Doors</a>
      <a class="pdf-topbar__back" href="products.html">&larr; Back to Products</a>
    </div>
  </header>

  <!-- ===================== VIEWER ===================== -->
  <main class="pdf-main">
    <div class="container">

      <div class="pdf-toolbar" role="toolbar" aria-label="Document controls">
        <h1 class="pdf-toolbar__title" id="pdfTitle">Document</h1>
        <div class="pdf-toolbar__controls">
          <div class="pdf-zoom">
            <button type="button" class="pdf-btn" id="pdfZoomOut" aria-label="Zoom out">&minus;</button>
            <span class="pdf-zoom__val" id="pdfZoomVal" aria-live="polite">100%</span>
            <button type="button" class="pdf-btn" id="pdfZoomIn" aria-label="Zoom in">+</button>
            <button type="button" class="pdf-btn pdf-btn--wide" id="pdfFitWidth" aria-pressed="true">Fit width</button>
            <button type="button" class="pdf-btn pdf-btn--wide" id="pdfFitPage" aria-pressed="false">Fit page</button>
          </div>
          <div class="pdf-nav">
            <button type="button" class="pdf-btn pdf-btn--wide" id="pdfPrev" disabled>Prev</button>
            <span class="pdf-pageinfo" id="pdfPageInfo" aria-live="polite">Page 1</span>
            <button type="button" class="pdf-btn pdf-btn--wide" id="pdfNext" disabled>Next</button>
          </div>
        </div>
      </div>

      <p class="pdf-status" id="pdfStatus" hidden>Loading document&hellip;</p>

      <div class="pdf-stage" id="pdfStage"></div>

    </div>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="pdf-foot">
    <div class="container">
      <p>&copy; <span id="year">2026</span> Mid-Florida Windows and Doors, LLC. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js?v=20261108a" defer></script>
  <script src="js/pdf-viewer.js?v=20261023c" defer></script>
</body>
</html>
